name: "Sense Color"
version: "0.1.1"
description: "Reports the average color under a sprite, with a cached backdrop"
author: "sandisk/mc20000 jamie@sdisk.us"
license: "Apache-2.0"

entryPoint: "src/index.js"
outputPath: "dist/extension.js"

extension:
  id: "sensecolor"
  name: "Sense Color"
  className: "SenseColorExtension"
  color1: "#E8590C"
  color2: "#D9480F"
  color3: "#C2410C"
  isUnsandboxed: true

blocks:
  - opcode: colorUnder
    blockType: reporter
    text: "color under me"
  - "---"
  - opcode: coverage
    blockType: reporter
    text: "cache coverage %"
  - opcode: clear
    blockType: command
    text: "clear color cache"
